name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pinned npm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Show toolchain
        run: |
          node --version
          npm --version
      - name: Install locked dependencies
        run: npm ci
      - name: Lint, test, typecheck and verify extension build
        run: npm run check
      - name: Install isolated Chromium for extension tests
        run: npx playwright install --with-deps chromium
      - name: Run extension-only E2E
        run: npm run test:e2e
      - name: Verify dependency files were not changed
        run: git diff --exit-code -- package.json package-lock.json
